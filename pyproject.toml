[project]
name = "paper-agent"
version = "0.1.0"
description = "Interactive research paper agent — ask questions, build knowledge, compound insights"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "python-dotenv>=1.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml_html_clean>=0.1",
]

[project.scripts]
paper-agent = "paper_agent.cli:cli"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
